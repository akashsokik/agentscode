<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- AgentsCode: two agents as a warm and a cool code bracket, talking (the speech bubble). The sidebar mark
       (web/ui/BrandMark.tsx) and the favicon (index.html) draw the same brackets and dots without the bubble. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3140" />
      <stop offset="1" stop-color="#0b0d13" />
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="110" /></filter>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc09a" />
      <stop offset="1" stop-color="#e2744a" />
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8d4ff" />
      <stop offset="1" stop-color="#3a86f4" />
    </linearGradient>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="185" /></clipPath>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#drop)" />
  <g clip-path="url(#clip)">
    <circle cx="512" cy="540" r="250" fill="#3b82f6" fill-opacity="0.42" filter="url(#soft)" />
    <rect x="100" y="100" width="824" height="824" fill="url(#gloss)" />
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3" />
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
  </defs>
  <g filter="url(#lift)">
    <path d="M352 314 188 512l164 198" fill="none" stroke="url(#warm)" stroke-width="78" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M672 314l164 198-164 198" fill="none" stroke="url(#cool)" stroke-width="78" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M436 420h152a76 76 0 0 1 76 76v0a76 76 0 0 1-76 76H470l-44 40 6-46a76 76 0 0 1-72-76v6a76 76 0 0 1 76-76z" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.28" stroke-width="4" stroke-linejoin="round" />
    <circle cx="456" cy="496" r="27" fill="#f4f4f5" fill-opacity="0.5" />
    <circle cx="512" cy="496" r="27" fill="#f4f4f5" fill-opacity="0.78" />
    <circle cx="568" cy="496" r="27" fill="#f4f4f5" />
  </g>
</svg>
