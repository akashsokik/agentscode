<!doctype html>
<html lang="en" class="layout-inset">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before the first paint; web/theme.ts owns it afterwards.
      (function () {
        var pref = 'dark';
        try { pref = localStorage.getItem('agentscode:theme') || pref; } catch (e) {}
        var light = pref === 'light' || (pref === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        if (light) document.documentElement.classList.add('theme-light');
        if (/Mac/.test(navigator.platform)) document.documentElement.classList.add('is-mac');
      })();
    </script>
    <title>AgentsCode</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='3' fill='%23202024'/%3E%3Cpath d='M5 5.5 3 8l2 2.5M11 5.5 13 8l-2 2.5' stroke='%2363a4f8' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='8' cy='8' r='1.2' fill='%23e8e8ea'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
