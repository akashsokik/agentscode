<!doctype html>
<html lang="en" class="layout-inset">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before the first paint; web/theme.ts owns it afterwards.
      (function () {
        var pref = 'dark';
        try { pref = localStorage.getItem('agentscode:theme') || pref; } catch (e) {}
        var light = pref === 'light' || (pref === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        if (light) document.documentElement.classList.add('theme-light');
        if (/Mac/.test(navigator.platform)) document.documentElement.classList.add('is-mac');
      })();
    </script>
    <title>AgentsCode</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3.5' fill='%230a0a0a'/%3E%3Crect x='3' y='3' width='4.5' height='4.5' fill='%23f5f5f5'/%3E%3Crect x='8.5' y='3' width='4.5' height='4.5' fill='%23ec8a60'/%3E%3Crect x='3' y='8.5' width='4.5' height='4.5' fill='%23459bf7'/%3E%3Crect x='8.5' y='8.5' width='4.5' height='4.5' fill='%23f5f5f5'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
